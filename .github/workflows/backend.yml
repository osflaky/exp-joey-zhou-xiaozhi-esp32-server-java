name: backend

# 后端门禁：编译 + 全量单测。测试全是纯单测（仓库里没有 @SpringBootTest），
# 不需要 MySQL / Redis / Qdrant，所以 CI 里不起任何外部服务。
on:
  workflow_dispatch:

# 同一分支上新推送直接顶掉旧的排队任务
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, 
            macos-latest, macos-15-intel]
      fail-fast: false
      max-parallel: 6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven

      # sherpa-onnx 没发布到 Maven Central，从仓库自带的 repo/ 目录解析：
      # 根 pom 的 project-local 仓库地址是 file://${maven.multiModuleProjectDirectory}/repo，
      # 该属性由 mvn 启动脚本置为调用时的工作目录，因此必须在仓库根目录执行。
    - name: Run tests
      run: mvn -B -ntp clean test

    - name: Upload surefire reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports-${{ matrix.os }}
        path: '**/target/surefire-reports/**'
        retention-days: 7
